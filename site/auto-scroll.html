<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jira Wallboard — Auto-Cycle View</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔄</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col antialiased">

  <!-- Header -->
  <header class="border-b border-slate-800/80 bg-slate-900/90 backdrop-blur sticky top-0 z-30 px-6 py-3.5">
    <div class="max-w-[1920px] mx-auto flex flex-wrap items-center justify-between gap-4">
      
      <!-- Left: Identity -->
      <div class="flex items-center space-x-4">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-600 via-teal-600 to-cyan-600 flex items-center justify-center shadow-lg shadow-teal-500/25">
          <i data-lucide="refresh-cw" class="w-6 h-6 text-white"></i>
        </div>
        <div>
          <div class="flex items-center space-x-3">
            <h1 id="board-title" class="font-extrabold text-xl lg:text-2xl text-white tracking-tight">Project Board</h1>
            <span class="px-2.5 py-0.5 text-xs font-bold rounded-lg bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              Auto-Cycle
            </span>
          </div>
          <p class="text-xs text-slate-400 flex items-center gap-2 mt-0.5">
            <span id="project-meta-wrap">Project: <span id="project-key" class="font-mono text-slate-200 font-semibold">-</span></span>
            <span id="board-meta-sep">•</span>
            <span id="board-meta-wrap">Board: <span id="board-id" class="font-mono text-slate-200 font-semibold">-</span></span>
          </p>
        </div>
      </div>

      <!-- Center: Layout View Switcher -->
      <nav class="flex items-center bg-slate-800/80 p-1.5 rounded-xl border border-slate-700/60 shadow-inner">
        <a href="index.html" class="flex items-center gap-2 px-4 py-1.5 text-xs font-medium rounded-lg text-slate-300 hover:text-white hover:bg-slate-700/50 transition">
          <i data-lucide="target" class="w-3.5 h-3.5"></i>
          <span>Active Focus</span>
        </a>
        <a href="auto-scroll.html" class="flex items-center gap-2 px-4 py-1.5 text-xs font-bold rounded-lg bg-emerald-600 text-white shadow">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
          <span>Auto-Cycle</span>
        </a>
        <a href="compact-grid.html" class="flex items-center gap-2 px-4 py-1.5 text-xs font-medium rounded-lg text-slate-300 hover:text-white hover:bg-slate-700/50 transition">
          <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
          <span>Dense Grid</span>
        </a>
      </nav>

      <!-- Right: Cycle Status, Refresh Timer, Digital Clock -->
      <div class="flex items-center space-x-4">
        <!-- Rotation Cycle Indicator -->
        <div class="flex items-center gap-2 bg-slate-800/80 border border-slate-700/70 px-3 py-1.5 rounded-xl text-xs">
          <button id="toggle-cycle-btn" class="text-emerald-400 hover:text-white transition">
            <i id="cycle-icon" data-lucide="pause" class="w-4 h-4"></i>
          </button>
          <span class="text-slate-400">Page <span id="current-page-num" class="font-bold text-white">1</span> of <span id="total-page-num" class="font-bold text-white">1</span></span>
          <span class="text-slate-600">•</span>
          <span class="text-slate-400">Next in <span id="cycle-timer-sec" class="font-mono font-bold text-emerald-400">12s</span></span>
        </div>

        <!-- Silent Auto-Refresh countdown -->
        <div class="hidden lg:flex items-center gap-2 bg-slate-800/60 border border-slate-700/50 px-3.5 py-1.5 rounded-xl text-xs">
          <i id="refresh-indicator" data-lucide="cloud-download" class="w-3.5 h-3.5 text-blue-400"></i>
          <span class="text-slate-400">Sync in:</span>
          <span id="refresh-countdown" class="font-mono font-bold text-slate-200">3h 0m</span>
        </div>

        <!-- Clock -->
        <div class="text-right pl-2 border-l border-slate-800">
          <div id="digital-clock" class="font-mono text-lg lg:text-xl font-extrabold text-white tracking-wider leading-none">--:--:--</div>
          <div id="digital-date" class="text-[11px] font-medium text-slate-400 mt-0.5">--</div>
        </div>
      </div>
    </div>
  </header>

  <!-- KPI Banner -->
  <section class="max-w-[1920px] w-full mx-auto px-6 pt-5 pb-2">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-slate-900/70 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Issues</span>
          <div id="metric-total" class="text-3xl font-extrabold text-white mt-1">0</div>
        </div>
        <div class="w-11 h-11 rounded-xl bg-slate-800 flex items-center justify-center text-slate-400">
          <i data-lucide="layers" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="bg-slate-900/70 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <span class="text-xs font-semibold text-amber-400 uppercase tracking-wider">To Do</span>
          <div id="metric-todo" class="text-3xl font-extrabold text-amber-300 mt-1">0</div>
        </div>
        <div class="w-11 h-11 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400">
          <i data-lucide="circle-dot" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="bg-slate-900/70 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <span class="text-xs font-semibold text-blue-400 uppercase tracking-wider">In Progress</span>
          <div id="metric-inprogress" class="text-3xl font-extrabold text-blue-300 mt-1">0</div>
        </div>
        <div class="w-11 h-11 rounded-xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-400">
          <i data-lucide="play-circle" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="bg-slate-900/70 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">Done</span>
          <div id="metric-done" class="text-3xl font-extrabold text-emerald-300 mt-1">0</div>
        </div>
        <div class="w-11 h-11 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
          <i data-lucide="check-circle-2" class="w-6 h-6"></i>
        </div>
      </div>
    </div>
  </section>

  <!-- Wallboard Columns -->
  <main class="max-w-[1920px] w-full mx-auto px-6 py-4 flex-1 grid grid-cols-1 md:grid-cols-3 gap-6">
    <!-- To Do -->
    <div class="bg-slate-900/50 border border-slate-800/90 rounded-2xl p-4 flex flex-col">
      <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
        <div class="flex items-center space-x-2.5">
          <span class="w-3 h-3 rounded-full bg-amber-400"></span>
          <h2 class="font-bold text-base text-slate-200 uppercase tracking-wider">To Do</h2>
        </div>
        <span id="col-count-todo" class="px-2.5 py-0.5 text-xs font-bold rounded-lg bg-slate-800 text-amber-300 border border-slate-700">0</span>
      </div>
      <div id="col-issues-todo" class="space-y-3.5 flex-1 overflow-y-auto page-fade-enter"></div>
    </div>

    <!-- In Progress -->
    <div class="bg-slate-900/50 border border-slate-800/90 rounded-2xl p-4 flex flex-col">
      <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
        <div class="flex items-center space-x-2.5">
          <span class="w-3 h-3 rounded-full bg-blue-400"></span>
          <h2 class="font-bold text-base text-slate-200 uppercase tracking-wider">In Progress</h2>
        </div>
        <span id="col-count-inprogress" class="px-2.5 py-0.5 text-xs font-bold rounded-lg bg-slate-800 text-blue-300 border border-slate-700">0</span>
      </div>
      <div id="col-issues-inprogress" class="space-y-3.5 flex-1 overflow-y-auto page-fade-enter"></div>
    </div>

    <!-- Done -->
    <div class="bg-slate-900/50 border border-slate-800/90 rounded-2xl p-4 flex flex-col">
      <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
        <div class="flex items-center space-x-2.5">
          <span class="w-3 h-3 rounded-full bg-emerald-400"></span>
          <h2 class="font-bold text-base text-slate-200 uppercase tracking-wider">Done</h2>
        </div>
        <span id="col-count-done" class="px-2.5 py-0.5 text-xs font-bold rounded-lg bg-slate-800 text-emerald-300 border border-slate-700">0</span>
      </div>
      <div id="col-issues-done" class="space-y-3.5 flex-1 overflow-y-auto page-fade-enter"></div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="tv-common.js"></script>
  <script>
    let allData = null;
    let todoList = [];
    let inprogressList = [];
    let doneList = [];

    const PAGE_SIZE = 5; // Cards per column per rotation page
    let currentPage = 0;
    let totalPages = 1;
    let CYCLE_DURATION_SEC = (window.WALLBOARD_CONFIG && window.WALLBOARD_CONFIG.cycleDurationSeconds) || 12;
    let cycleTimeRemaining = CYCLE_DURATION_SEC;
    let cycleInterval = null;
    let isPaused = false;

    async function loadData() {
      try {
        const res = await fetch('data/jira_data.json?v=' + Date.now());
        if (!res.ok) throw new Error('Data fetch failed');
        allData = await res.json();
        setupAutoCycle();
      } catch (e) {
        console.error('Failed to load Jira data:', e);
      }
    }

    function setupAutoCycle() {
      const meta = allData.metadata || {};
      const issues = allData.issues || [];

      document.getElementById('board-title').textContent = meta.title || 'Project Board';
      if (meta.project_key) document.getElementById('project-key').textContent = meta.project_key;
      if (meta.board_id) document.getElementById('board-id').textContent = meta.board_id;

      todoList = issues.filter(i => i.status_category === 'new');
      inprogressList = issues.filter(i => i.status_category === 'indeterminate');
      doneList = issues.filter(i => i.status_category === 'done');

      document.getElementById('metric-total').textContent = issues.length;
      document.getElementById('metric-todo').textContent = todoList.length;
      document.getElementById('metric-inprogress').textContent = inprogressList.length;
      document.getElementById('metric-done').textContent = doneList.length;

      document.getElementById('col-count-todo').textContent = todoList.length;
      document.getElementById('col-count-inprogress').textContent = inprogressList.length;
      document.getElementById('col-count-done').textContent = doneList.length;

      const maxList = Math.max(todoList.length, inprogressList.length, doneList.length);
      totalPages = Math.max(1, Math.ceil(maxList / PAGE_SIZE));
      document.getElementById('total-page-num').textContent = totalPages;

      renderCurrentPage();
      startCycleTicker();
    }

    function renderCurrentPage() {
      document.getElementById('current-page-num').textContent = currentPage + 1;

      const todoSlice = todoList.slice(currentPage * PAGE_SIZE, (currentPage + 1) * PAGE_SIZE);
      const inprogressSlice = inprogressList.slice(currentPage * PAGE_SIZE, (currentPage + 1) * PAGE_SIZE);
      const doneSlice = doneList.slice(currentPage * PAGE_SIZE, (currentPage + 1) * PAGE_SIZE);

      renderCards(document.getElementById('col-issues-todo'), todoSlice, 'tv-card-todo');
      renderCards(document.getElementById('col-issues-inprogress'), inprogressSlice, 'tv-card-inprogress');
      renderCards(document.getElementById('col-issues-done'), doneSlice, 'tv-card-done');

      if (window.lucide) lucide.createIcons();
    }

    function renderCards(container, issues, borderClass) {
      if (issues.length === 0) {
        container.innerHTML = '<div class="text-center py-12 text-slate-500 text-sm font-medium">End of list / No issues</div>';
        return;
      }

      container.className = 'space-y-3.5 flex-1 overflow-y-auto page-fade-enter';
      container.innerHTML = issues.map(issue => {
        const priorityClass = getPriorityBadgeClass(issue.priority);
        const typeIcon = getTypeIcon(issue.issue_type);
        const avatarHTML = issue.assignee_avatar
          ? `<img src="${issue.assignee_avatar}" class="w-6 h-6 rounded-full object-cover ring-1 ring-slate-600" />`
          : `<div class="w-6 h-6 rounded-full bg-slate-700 flex items-center justify-center text-xs font-bold text-slate-200">${issue.assignee ? issue.assignee.charAt(0) : '?'}</div>`;

        return `
          <div class="tv-card ${borderClass} border border-slate-800 rounded-xl p-4 shadow-sm">
            <div class="flex items-center justify-between mb-2">
              <div class="flex items-center gap-2">
                <i data-lucide="${typeIcon}" class="w-4 h-4 text-slate-400"></i>
                <span class="font-mono text-sm font-bold text-emerald-400">${issue.key}</span>
              </div>
              <span class="text-xs font-bold px-2.5 py-0.5 rounded-md border ${priorityClass}">
                ${issue.priority}
              </span>
            </div>

            <p class="text-sm font-semibold text-slate-100 leading-snug line-clamp-2 mb-3">
              ${issue.summary}
            </p>

            <div class="flex items-center justify-between pt-2 border-t border-slate-800/80 text-xs text-slate-400">
              <div class="flex items-center gap-2">
                ${avatarHTML}
                <span class="font-medium text-slate-300 text-xs">${issue.assignee || 'Unassigned'}</span>
              </div>
              <span class="text-[11px] text-slate-400 font-mono">${formatRelativeTime(issue.updated)}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function startCycleTicker() {
      if (cycleInterval) clearInterval(cycleInterval);
      cycleTimeRemaining = CYCLE_DURATION_SEC;

      cycleInterval = setInterval(() => {
        if (isPaused) return;

        cycleTimeRemaining--;
        document.getElementById('cycle-timer-sec').textContent = `${cycleTimeRemaining}s`;

        if (cycleTimeRemaining <= 0) {
          cycleTimeRemaining = CYCLE_DURATION_SEC;
          currentPage = (currentPage + 1) % totalPages;
          renderCurrentPage();
        }
      }, 1000);
    }

    // Toggle pause/play
    document.getElementById('toggle-cycle-btn').addEventListener('click', () => {
      isPaused = !isPaused;
      const icon = document.getElementById('cycle-icon');
      if (isPaused) {
        icon.setAttribute('data-lucide', 'play');
      } else {
        icon.setAttribute('data-lucide', 'pause');
      }
      if (window.lucide) lucide.createIcons();
    });

    document.addEventListener('DOMContentLoaded', () => {
      initRefreshSettings(loadData);
      loadData();
    });
  </script>
</body>
</html>
