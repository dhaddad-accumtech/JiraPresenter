<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jira Wallboard — Active Focus</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📺</text></svg>">
  <script src="config.js"></script>
  <script>
    // Apply the effective theme before first paint to avoid a dark->light flash.
    // Precedence: ?theme= URL param > config.js `theme` (kiosk override) > localStorage.
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        var forced = params.get('theme');
        if (forced !== 'dark' && forced !== 'light') {
          var cfg = window.WALLBOARD_CONFIG && window.WALLBOARD_CONFIG.theme;
          forced = (cfg === 'dark' || cfg === 'light') ? cfg : null;
        }
        var theme = forced || localStorage.getItem('wallboard-theme');
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col antialiased">

  <!-- Top Wallboard Header -->
  <header class="border-b border-slate-800/80 bg-slate-900/90 backdrop-blur sticky top-0 z-30 px-6 py-3.5">
    <div class="max-w-[1920px] mx-auto flex flex-wrap items-center justify-between gap-4">
      
      <!-- Left: Board Identity & Live Badge -->
      <div class="flex items-center space-x-4">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-violet-600 flex items-center justify-center shadow-lg shadow-blue-500/25">
          <i data-lucide="tv" class="w-6 h-6 text-white"></i>
        </div>
        <div>
          <div class="flex items-center space-x-3">
            <h1 id="board-title" class="font-extrabold text-xl lg:text-2xl text-white tracking-tight">Project Board</h1>
            <span id="sprint-badge" class="px-2.5 py-0.5 text-xs font-bold rounded-lg bg-blue-500/15 text-blue-400 border border-blue-500/30">Active Sprint</span>
          </div>
          <p class="text-xs text-slate-400 flex items-center gap-2 mt-0.5">
            <span id="project-meta-wrap">Project: <span id="project-key" class="font-mono text-slate-200 font-semibold">-</span></span>
            <span id="board-meta-sep">•</span>
            <span id="board-meta-wrap">Board: <span id="board-id" class="font-mono text-slate-200 font-semibold">-</span></span>
          </p>
        </div>
      </div>

      <!-- Center: Layout View Switcher (Compare Options) -->
      <nav class="flex items-center bg-slate-800/80 p-1.5 rounded-xl border border-slate-700/60 shadow-inner">
        <a href="index.html" class="flex items-center gap-2 px-4 py-1.5 text-xs font-bold rounded-lg bg-blue-600 text-white shadow">
          <i data-lucide="target" class="w-3.5 h-3.5"></i>
          <span>Active Focus</span>
        </a>
        <a href="auto-scroll.html" class="flex items-center gap-2 px-4 py-1.5 text-xs font-medium rounded-lg text-slate-300 hover:text-white hover:bg-slate-700/50 transition">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
          <span>Auto-Cycle</span>
        </a>
        <a href="compact-grid.html" class="flex items-center gap-2 px-4 py-1.5 text-xs font-medium rounded-lg text-slate-300 hover:text-white hover:bg-slate-700/50 transition">
          <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
          <span>Dense Grid</span>
        </a>
      </nav>

      <!-- Right: Clock, Auto-Refresh Interval & Countdown -->
      <div class="flex items-center space-x-4">
        <!-- Next Refresh Countdown -->
        <div class="flex items-center gap-2 bg-slate-800/60 border border-slate-700/50 px-3.5 py-1.5 rounded-xl text-xs">
          <i id="refresh-indicator" data-lucide="refresh-cw" class="w-3.5 h-3.5 text-blue-400"></i>
          <span class="text-slate-400">Sync in:</span>
          <span id="refresh-countdown" class="font-mono font-bold text-slate-200">3h 0m</span>
        </div>

        <!-- Light/Dark Theme Toggle -->
        <button id="theme-toggle-btn" class="flex items-center justify-center w-9 h-9 rounded-xl bg-slate-800/60 border border-slate-700/50 text-slate-300 hover:text-white hover:bg-slate-700/50 transition" title="Toggle light/dark mode">
          <i id="theme-icon" data-lucide="moon" class="w-4 h-4"></i>
        </button>

        <!-- Big Digital Clock -->
        <div class="text-right pl-2 border-l border-slate-800">
          <div id="digital-clock" class="font-mono text-lg lg:text-xl font-extrabold text-white tracking-wider leading-none">--:--:--</div>
          <div id="digital-date" class="text-[11px] font-medium text-slate-400 mt-0.5">--</div>
        </div>
      </div>
    </div>
  </header>

  <!-- KPI Banner -->
  <section class="max-w-[1920px] w-full mx-auto px-6 pt-5 pb-2">
    <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
      <div class="bg-slate-900/70 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Active Scope</span>
          <div id="metric-total" class="text-3xl font-extrabold text-white mt-1">0</div>
        </div>
        <div class="w-11 h-11 rounded-xl bg-slate-800 flex items-center justify-center text-slate-400">
          <i data-lucide="layers" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="bg-slate-900/70 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <span class="text-xs font-semibold text-amber-400 uppercase tracking-wider">To Do</span>
          <div id="metric-todo" class="text-3xl font-extrabold text-amber-300 mt-1">0</div>
        </div>
        <div class="w-11 h-11 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400">
          <i data-lucide="circle-dot" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="bg-slate-900/70 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <span class="text-xs font-semibold text-blue-400 uppercase tracking-wider">In Progress</span>
          <div id="metric-inprogress" class="text-3xl font-extrabold text-blue-300 mt-1">0</div>
        </div>
        <div class="w-11 h-11 rounded-xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-400">
          <i data-lucide="play-circle" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="bg-slate-900/70 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">Done</span>
          <div id="metric-done" class="text-3xl font-extrabold text-emerald-300 mt-1">0</div>
        </div>
        <div class="w-11 h-11 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
          <i data-lucide="check-circle-2" class="w-6 h-6"></i>
        </div>
      </div>

      <!-- Completion Rate Bar -->
      <div class="col-span-2 md:col-span-1 bg-slate-900/70 border border-slate-800/80 rounded-2xl p-4 flex flex-col justify-center">
        <div class="flex justify-between items-center text-xs font-semibold mb-2">
          <span class="text-slate-300">Completion</span>
          <span id="metric-percent" class="text-emerald-400 font-extrabold text-base">0%</span>
        </div>
        <div class="w-full bg-slate-800 rounded-full h-3 overflow-hidden flex">
          <div id="progress-done" class="bg-emerald-500 h-3 transition-all duration-700" style="width: 0%"></div>
          <div id="progress-inprogress" class="bg-blue-500 h-3 transition-all duration-700" style="width: 0%"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Wallboard Columns -->
  <main class="max-w-[1920px] w-full mx-auto px-6 py-4 flex-1 grid grid-cols-1 md:grid-cols-3 gap-6">

    <!-- Column: To Do -->
    <div class="bg-slate-900/50 border border-slate-800/90 rounded-2xl p-4 flex flex-col">
      <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
        <div class="flex items-center space-x-2.5">
          <span class="w-3 h-3 rounded-full bg-amber-400"></span>
          <h2 class="font-bold text-base text-slate-200 uppercase tracking-wider">To Do</h2>
        </div>
        <span id="col-count-todo" class="px-2.5 py-0.5 text-xs font-bold rounded-lg bg-slate-800 text-amber-300 border border-slate-700">0</span>
      </div>
      <div id="col-issues-todo" class="space-y-3.5 flex-1 overflow-y-auto pr-1"></div>
    </div>

    <!-- Column: In Progress -->
    <div class="bg-slate-900/50 border border-slate-800/90 rounded-2xl p-4 flex flex-col">
      <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
        <div class="flex items-center space-x-2.5">
          <span class="w-3 h-3 rounded-full bg-blue-400"></span>
          <h2 class="font-bold text-base text-slate-200 uppercase tracking-wider">In Progress</h2>
        </div>
        <span id="col-count-inprogress" class="px-2.5 py-0.5 text-xs font-bold rounded-lg bg-slate-800 text-blue-300 border border-slate-700">0</span>
      </div>
      <div id="col-issues-inprogress" class="space-y-3.5 flex-1 overflow-y-auto pr-1"></div>
    </div>

    <!-- Column: Done -->
    <div class="bg-slate-900/50 border border-slate-800/90 rounded-2xl p-4 flex flex-col">
      <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
        <div class="flex items-center space-x-2.5">
          <span class="w-3 h-3 rounded-full bg-emerald-400"></span>
          <h2 class="font-bold text-base text-slate-200 uppercase tracking-wider">Done</h2>
        </div>
        <span id="col-count-done" class="px-2.5 py-0.5 text-xs font-bold rounded-lg bg-slate-800 text-emerald-300 border border-slate-700">0</span>
      </div>
      <div id="col-issues-done" class="space-y-3.5 flex-1 overflow-y-auto pr-1"></div>
    </div>

  </main>

  <script src="tv-common.js"></script>
  <script>
    let activeIssues = [];

    async function loadData() {
      try {
        const res = await fetch('data/jira_data.json?v=' + Date.now());
        if (!res.ok) throw new Error('Data fetch failed');
        const data = await res.json();
        renderWallboard(data);
      } catch (e) {
        console.error('Failed to load Jira data:', e);
      }
    }

    function renderWallboard(data) {
      const meta = data.metadata || {};
      const allIssues = data.issues || [];

      document.getElementById('board-title').textContent = meta.title || 'Project Board';
      if (meta.project_key) document.getElementById('project-key').textContent = meta.project_key;
      if (meta.board_id) document.getElementById('board-id').textContent = meta.board_id;

      // Filter: Focus on active sprint if available, or most recent ~25 active issues
      const activeSprints = [...new Set(allIssues.map(i => i.sprint).filter(Boolean))];
      let displayIssues = allIssues;
      
      if (activeSprints.length > 0) {
        const currentSprint = activeSprints[0];
        document.getElementById('sprint-badge').textContent = currentSprint;
        displayIssues = allIssues.filter(i => i.sprint === currentSprint);
        // If current sprint is too small or empty, fallback
        if (displayIssues.length < 5) displayIssues = allIssues.slice(0, 30);
      } else {
        document.getElementById('sprint-badge').textContent = 'Top Active Issues';
        displayIssues = allIssues.slice(0, 30);
      }

      activeIssues = displayIssues;

      // Update metrics
      const total = displayIssues.length;
      const todo = displayIssues.filter(i => i.status_category === 'new').length;
      const inprogress = displayIssues.filter(i => i.status_category === 'indeterminate').length;
      const done = displayIssues.filter(i => i.status_category === 'done').length;

      document.getElementById('metric-total').textContent = total;
      document.getElementById('metric-todo').textContent = todo;
      document.getElementById('metric-inprogress').textContent = inprogress;
      document.getElementById('metric-done').textContent = done;

      const pct = total > 0 ? Math.round((done / total) * 100) : 0;
      document.getElementById('metric-percent').textContent = `${pct}%`;
      document.getElementById('progress-done').style.width = `${total > 0 ? (done / total) * 100 : 0}%`;
      document.getElementById('progress-inprogress').style.width = `${total > 0 ? (inprogress / total) * 100 : 0}%`;

      document.getElementById('col-count-todo').textContent = todo;
      document.getElementById('col-count-inprogress').textContent = inprogress;
      document.getElementById('col-count-done').textContent = done;

      // Render cards
      renderCards(document.getElementById('col-issues-todo'), displayIssues.filter(i => i.status_category === 'new'), 'tv-card-todo');
      renderCards(document.getElementById('col-issues-inprogress'), displayIssues.filter(i => i.status_category === 'indeterminate'), 'tv-card-inprogress');
      renderCards(document.getElementById('col-issues-done'), displayIssues.filter(i => i.status_category === 'done'), 'tv-card-done');

      if (window.lucide) lucide.createIcons();
    }

    function renderCards(container, issues, borderClass) {
      if (issues.length === 0) {
        container.innerHTML = '<div class="text-center py-12 text-slate-500 text-sm font-medium">No issues in this state</div>';
        return;
      }

      container.innerHTML = issues.map(issue => {
        const priorityClass = getPriorityBadgeClass(issue.priority);
        const typeIcon = getTypeIcon(issue.issue_type);
        const avatarHTML = issue.assignee_avatar
          ? `<img src="${issue.assignee_avatar}" class="w-6 h-6 rounded-full object-cover ring-1 ring-slate-600" />`
          : `<div class="w-6 h-6 rounded-full bg-slate-700 flex items-center justify-center text-xs font-bold text-slate-200">${issue.assignee ? issue.assignee.charAt(0) : '?'}</div>`;

        return `
          <div class="tv-card ${borderClass} border border-slate-800 rounded-xl p-4 shadow-sm">
            <div class="flex items-center justify-between mb-2">
              <div class="flex items-center gap-2">
                <i data-lucide="${typeIcon}" class="w-4 h-4 text-slate-400"></i>
                <span class="font-mono text-sm font-bold text-blue-400">${issue.key}</span>
              </div>
              <span class="text-xs font-bold px-2.5 py-0.5 rounded-md border ${priorityClass}">
                ${issue.priority}
              </span>
            </div>

            <p class="text-sm font-semibold text-slate-100 leading-snug line-clamp-2 mb-3">
              ${issue.summary}
            </p>

            <div class="flex items-center justify-between pt-2 border-t border-slate-800/80 text-xs text-slate-400">
              <div class="flex items-center gap-2">
                ${avatarHTML}
                <span class="font-medium text-slate-300 text-xs">${issue.assignee || 'Unassigned'}</span>
              </div>
              <span class="text-[11px] text-slate-400 font-mono">${formatRelativeTime(issue.updated)}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      initRefreshSettings(loadData);
      loadData();
    });
  </script>
</body>
</html>
