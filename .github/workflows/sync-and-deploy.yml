name: Sync Jira & Deploy to GitHub Pages

on:
  schedule:
    # Runs every 3 hours (e.g., 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    # To run only Mon-Fri business hours (8am-6pm Eastern / ~12:00-22:00 UTC), adjust the cron string below.
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab
  push:
    branches:
      - main
      - master

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Jira Issues
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BOARD_ID: ${{ secrets.JIRA_BOARD_ID }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          JIRA_JQL: ${{ secrets.JIRA_JQL }}
          SITE_TITLE: ${{ vars.SITE_TITLE || secrets.SITE_TITLE }}
        run: |
          python scripts/fetch_jira.py --output site/data/jira_data.json

      - name: Apply Wallboard Theme Override
        if: ${{ vars.WALLBOARD_THEME != '' || secrets.WALLBOARD_THEME != '' }}
        env:
          WALLBOARD_THEME: ${{ vars.WALLBOARD_THEME || secrets.WALLBOARD_THEME }}
        run: |
          python - <<'PY'
          import os, re, sys

          theme = os.environ["WALLBOARD_THEME"].strip().lower()
          if theme not in ("dark", "light", "auto"):
              sys.exit(f"WALLBOARD_THEME must be 'dark', 'light', or 'auto' (got: {theme!r})")

          path = "site/config.js"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          new_content, count = re.subn(r"theme:\s*'[^']*'", f"theme: '{theme}'", content)
          if count != 1:
              sys.exit("Could not find a single `theme:` field to update in site/config.js")

          with open(path, "w", encoding="utf-8") as f:
              f.write(new_content)

          print(f"Wallboard theme set to '{theme}' for this deployment")
          PY

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
